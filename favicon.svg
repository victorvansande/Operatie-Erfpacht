<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Solid Stealth Black/Navy Background -->
  <rect width="512" height="512" fill="#070a10"/>

  <!-- Subtle Outer Reticle Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#1e293b" stroke-width="16"/>

  <!-- Authentic Faceted 4-Point Intelligence Compass Star (CIA / NATO / Secret Service style) -->
  <!-- North Point -->
  <polygon points="256,36 292,220 256,256" fill="#f8fafc"/>
  <polygon points="256,36 220,220 256,256" fill="#64748b"/>

  <!-- South Point -->
  <polygon points="256,476 220,292 256,256" fill="#f8fafc"/>
  <polygon points="256,476 292,292 256,256" fill="#64748b"/>

  <!-- East Point -->
  <polygon points="476,256 292,292 256,256" fill="#f8fafc"/>
  <polygon points="476,256 292,220 256,256" fill="#64748b"/>

  <!-- West Point -->
  <polygon points="36,256 220,220 256,256" fill="#f8fafc"/>
  <polygon points="36,256 220,292 256,256" fill="#64748b"/>

  <!-- Central Erfpacht Gold Keyhole Seal -->
  <circle cx="256" cy="256" r="54" fill="#070a10" stroke="#f59e0b" stroke-width="18"/>

  <!-- Crisp Keyhole Silhouette (Official Security Cutout) -->
  <circle cx="256" cy="244" r="18" fill="#f59e0b"/>
  <polygon points="246,246 266,246 271,276 241,276" fill="#f59e0b"/>
</svg>