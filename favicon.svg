<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Deep Official Midnight/Obsidian -->
  <rect width="512" height="512" fill="#070a10"/>

  <!-- Outer Security Seal Rings -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#f8fafc" stroke-width="4.5"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- Inner Document Stamp Border -->
  <circle cx="256" cy="256" r="154" fill="none" stroke="#f8fafc" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#c59b27" stroke-width="1.5"/>

  <!-- Official Circular Text Paths -->
  <defs>
    <!-- Top Arc (Left to Right, clockwise) -->
    <path id="sealArcTop" d="M 76 256 A 180 180 0 0 1 436 256" fill="none" />
    <!-- Bottom Arc (Right to Left, counter-clockwise so bottom text is upright!) -->
    <path id="sealArcBottom" d="M 76 256 A 180 180 0 0 0 436 256" fill="none" />
  </defs>

  <!-- Circular Stamp Typography -->
  <text font-family="'Space Grotesk', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#f8fafc" letter-spacing="8.5">
    <textPath href="#sealArcTop" startOffset="50%" text-anchor="middle">
      OPERATIE ERFPACHT
    </textPath>
  </text>

  <text font-family="'JetBrains Mono', 'Courier New', monospace" font-size="16" font-weight="800" fill="#c59b27" letter-spacing="8">
    <textPath href="#sealArcBottom" startOffset="50%" text-anchor="middle">
      ★ HERENTALS • 2026 ★
    </textPath>
  </text>

  <!-- Left & Right Flanking Security Stars -->
  <polygon points="62,256 67,250 74,250 68,255 70,262 64,258 58,262 60,255 54,250 61,250" fill="#c59b27"/>
  <polygon points="450,256 455,250 462,250 456,255 458,262 452,258 446,262 448,255 442,250 449,250" fill="#c59b27"/>

  <!-- Central Intelligence Medallion -->
  <circle cx="256" cy="256" r="114" fill="#0b111d" stroke="#1e293b" stroke-width="2"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- 8-Point Intelligence Compass Rose (Clean NATO/CIA Faceting) -->
  <g stroke="#1e293b" stroke-width="0.75">
    <!-- North -->
    <polygon points="256,256 256,150 250,256" fill="#475569"/>
    <polygon points="256,256 256,150 262,256" fill="#1e293b"/>
    <!-- South -->
    <polygon points="256,256 256,362 262,256" fill="#475569"/>
    <polygon points="256,256 256,362 250,256" fill="#1e293b"/>
    <!-- East -->
    <polygon points="256,256 362,256 256,250" fill="#475569"/>
    <polygon points="256,256 362,256 256,262" fill="#1e293b"/>
    <!-- West -->
    <polygon points="256,256 150,256 256,262" fill="#475569"/>
    <polygon points="256,256 150,256 256,250" fill="#1e293b"/>

    <!-- Diagonal Points (Slightly shorter) -->
    <!-- NE -->
    <polygon points="256,256 300,212 256,242" fill="#334155"/>
    <polygon points="256,256 300,212 270,256" fill="#0f172a"/>
    <!-- SE -->
    <polygon points="256,256 300,300 270,256" fill="#334155"/>
    <polygon points="256,256 300,300 256,270" fill="#0f172a"/>
    <!-- SW -->
    <polygon points="256,256 212,300 256,270" fill="#334155"/>
    <polygon points="256,256 212,300 242,256" fill="#0f172a"/>
    <!-- NW -->
    <polygon points="256,256 212,212 242,256" fill="#334155"/>
    <polygon points="256,256 212,212 256,242" fill="#0f172a"/>
  </g>

  <!-- The Erfpacht Skeleton Key (Crisp government document silhouette) -->
  <g fill="#f8fafc">
    <!-- Key Bow (Top Ring) -->
    <circle cx="256" cy="192" r="23" fill="none" stroke="#f8fafc" stroke-width="5.5"/>
    <circle cx="256" cy="192" r="11" fill="none" stroke="#c59b27" stroke-width="2.5"/>

    <!-- Gold Compass Arrowhead pointing North through Key -->
    <polygon points="256,150 260,178 256,171" fill="#c59b27"/>
    <polygon points="256,150 252,178 256,171" fill="#fef08a"/>

    <!-- Key Collar -->
    <rect x="249" y="215" width="14" height="4.5" rx="1" fill="#c59b27"/>

    <!-- Key Shaft -->
    <rect x="252.5" y="217" width="7" height="106" fill="#f8fafc"/>

    <!-- Key Bit (Erfpacht Double Lock Wards) -->
    <rect x="259.5" y="286" width="22" height="7" fill="#f8fafc"/>
    <path d="M 259.5 303 L 286 303 L 286 322 L 273 322 L 273 315 L 259.5 315 Z" fill="#f8fafc"/>
    <rect x="241.5" y="296" width="11" height="6" fill="#f8fafc"/>

    <!-- Bottom Pin Finial -->
    <circle cx="256" cy="326" r="4.5" fill="#c59b27"/>
  </g>

  <!-- Flanking Clean Monogram: "O" and "E" -->
  <text x="206" y="264" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="25" font-weight="900" fill="#f8fafc" letter-spacing="0">O</text>
  <text x="306" y="264" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="25" font-weight="900" fill="#f8fafc" letter-spacing="0">E</text>

  <!-- Classified Security Stamp Plaque -->
  <rect x="226" y="338" width="60" height="14" rx="2" fill="#070a10" stroke="#c59b27" stroke-width="1.2"/>
  <text x="256" y="348" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#c59b27" letter-spacing="2">INTEL</text>
</svg>